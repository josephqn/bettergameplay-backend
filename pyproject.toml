[project]
name = "bettergame-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "boto3>=1.35,<2",
    "google-genai>=2.22.0",
    "inference-sdk>=0.31,<1.3.6",
    "pillow>=10.0.0,<11.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
bettergame-backend = "bettergame_backend:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
