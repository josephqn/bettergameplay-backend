[project]
name = "gamesense-video-worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.22.0",
    "inference-sdk>=0.31,<1.3.6",
    "open-clip-torch>=3.3.0",
    "opencv-python>=4.8.1.78,<=4.10.0.84",
    "pillow>=10.0.0,<11.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "torch>=2.14.0",
    "ultralytics>=8.4.142",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
gamesense-video-worker = "gamesense_video_worker:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
